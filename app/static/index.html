<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Liara DevOps Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0e14;
      --card: #151b26;
      --accent: #00d4aa;
      --text: #e7ecf3;
      --muted: #8b9cb3;
      --term: #0d1117;
      --sidebar-w: 400px;
      --font-fa: 'Vazirmatn', 'Segoe UI', Tahoma, system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
    .sub { color: var(--muted); font-size: 0.85rem; margin: 0.25rem 0 0; }
    .app-shell { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .main-layout { display: flex; flex: 1; min-height: 0; overflow: hidden; }
    .left-panel {
      flex: 1;
      padding: 0.5rem 1rem 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      overflow: hidden;
      --left-pad-x: 1rem;
    }
    .left-toolbar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 0.65rem;
      flex-wrap: wrap;
      min-height: 36px;
    }
    .toolbar-meta { margin: 0; font-size: 0.78rem; color: var(--muted); }
    .repo-dropdown { position: relative; }
    .repo-dropdown-btn {
      margin: 0;
      padding: 0.45rem 0.85rem;
      font-size: 0.85rem;
      font-weight: 600;
      background: var(--card);
      color: var(--text);
      border: 1px solid #2d3a4f;
      border-radius: 8px;
      max-width: min(340px, 55vw);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
    }
    .repo-dropdown-btn:hover { border-color: #3d5a80; }
    .repo-dropdown-menu {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      z-index: 50;
      min-width: 300px;
      max-width: min(420px, 92vw);
      max-height: min(360px, 50vh);
      overflow-y: auto;
      background: var(--card);
      border: 1px solid #2d3a4f;
      border-radius: 10px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
      padding: 0.35rem 0;
    }
    .repo-dropdown-menu[hidden] { display: none !important; }
    .repo-dropdown-item {
      display: block;
      width: 100%;
      text-align: left;
      margin: 0;
      padding: 0.5rem 0.9rem;
      background: transparent;
      color: var(--text);
      font-weight: 500;
      font-size: 0.84rem;
      border: none;
      border-radius: 0;
      cursor: pointer;
    }
    .repo-dropdown-item:hover { background: #1a2535; }
    .repo-dropdown-item.is-selected { color: var(--accent); background: #15202e; }
    .repo-dropdown-refresh {
      border-top: 1px solid #2d3a4f;
      margin-top: 0.2rem;
      color: var(--muted) !important;
      font-size: 0.8rem !important;
    }
    .left-banners { flex-shrink: 0; width: 100%; }
    .left-banners .approval-bar,
    .left-banners .success-link { margin-top: 0; }
    .cursor-panel {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #252b36;
      border-radius: 8px;
      background: #0c1018;
      font-family: var(--font-fa);
    }
    .cursor-panel-header {
      flex-shrink: 0;
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid #252b36;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      background: #0e1219;
    }
    .cursor-panel-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.02em;
    }
    .cursor-panel-header button {
      margin: 0;
      padding: 0.25rem 0.55rem;
      font-size: 0.72rem;
      font-weight: 500;
      background: transparent;
      color: var(--muted);
      border: 1px solid #2d3a4f;
      border-radius: 6px;
    }
    .cursor-panel-header button:hover { color: var(--text); border-color: #3d5a80; }
    .cursor-thread {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      scroll-behavior: smooth;
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .cursor-thread-empty {
      font-size: 0.78rem;
      color: #5c6b80;
      line-height: 1.5;
      padding: 0.25rem 0;
    }
    .cursor-msg {
      font-size: 0.8rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
      padding: 0.5rem 0.65rem;
      border-radius: 8px;
    }
    .cursor-msg.user {
      background: #1a2433;
      border: 1px solid #2a3548;
      color: #d8dee8;
      align-self: flex-end;
      max-width: 95%;
    }
    .cursor-msg.assistant {
      background: transparent;
      border: none;
      padding: 0.35rem 0;
      color: #b8c4d4;
      max-width: 100%;
      font-family: var(--font-fa);
      font-size: 0.92rem;
      font-weight: 400;
      line-height: 1.75;
    }
    .cursor-msg.error {
      background: transparent;
      border: none;
      padding: 0.35rem 0;
      color: #e8a0a0;
    }
    .cursor-msg.assistant.streaming {
      color: #a8b8cc;
      min-height: 1.5em;
    }
    .cursor-msg[dir="rtl"] {
      text-align: right;
      unicode-bidi: plaintext;
    }
    .cursor-activity {
      font-size: 0.72rem;
      color: #6a8fad;
      margin-bottom: 0.4rem;
      line-height: 1.45;
      font-style: italic;
    }
    .cursor-stream-body {
      white-space: pre-wrap;
      word-break: break-word;
      font-family: var(--font-fa);
      font-size: 0.92rem;
      line-height: 1.75;
    }
    .cursor-composer {
      flex-shrink: 0;
      padding: 0.55rem 0.75rem 0.65rem;
      border-top: 1px solid #252b36;
      background: #0e1219;
    }
    .cursor-composer-row {
      display: flex;
      align-items: flex-end;
      gap: 0.5rem;
    }
    .cursor-composer textarea {
      flex: 1;
      min-height: 44px;
      max-height: 120px;
      margin: 0;
      font-family: var(--font-fa);
      font-size: 0.88rem;
      line-height: 1.65;
      resize: none;
      border-radius: 8px;
    }
    .composer-send-btn {
      margin: 0;
      flex-shrink: 0;
      width: 34px;
      height: 34px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      color: #6a7a92;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 400;
      line-height: 0;
    }
    .composer-send-btn:hover:not(:disabled) {
      color: #9eb0c8;
      background: rgba(255, 255, 255, 0.04);
    }
    .composer-send-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .composer-send-btn.is-stop {
      color: #9a8a8a;
    }
    .composer-send-btn.is-stop:hover:not(:disabled) {
      color: #c4a0a0;
    }
    .composer-send-btn svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .composer-send-btn svg.icon-stop {
      fill: currentColor;
      stroke: none;
      width: 14px;
      height: 14px;
    }
    .cursor-status {
      font-size: 0.68rem;
      color: #5c6b80;
      margin: 0;
      flex: 1;
      min-width: 0;
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .terminal-dock {
      flex: 0 0 auto;
      width: calc(100% + 2 * var(--left-pad-x));
      margin-left: calc(-1 * var(--left-pad-x));
      margin-right: calc(-1 * var(--left-pad-x));
      margin-bottom: 0;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .right-sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      border-left: 1px solid #2d3a4f;
      background: #0d1219;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }
    @media (max-width: 900px) {
      html, body { overflow: hidden; height: 100%; }
      .app-shell { height: 100vh; min-height: 0; }
      .main-layout { flex-direction: column; overflow: hidden; flex: 1; min-height: 0; }
      .right-sidebar {
        width: 100%;
        flex: 1;
        min-height: 0;
        border-left: none;
        border-top: 1px solid #2d3a4f;
        overflow: hidden;
      }
      .left-panel { flex: 1; min-height: 0; overflow: hidden; }
    }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
    .card { background: var(--card); border-radius: 12px; padding: 1rem; }
    .card h2 { font-size: 0.95rem; margin: 0 0 0.75rem; color: var(--accent); }
    label { font-size: 0.8rem; color: var(--muted); display: block; margin-top: 0.5rem; }
    input, select, textarea { width: 100%; background: var(--term); border: 1px solid #2d3a4f; color: var(--text); border-radius: 8px; padding: 0.5rem; margin-top: 0.2rem; font-family: inherit; font-size: 0.9rem; }
    button { background: var(--accent); color: #042; border: none; border-radius: 8px; padding: 0.6rem 1.1rem; font-weight: 700; cursor: pointer; margin-top: 0.6rem; margin-right: 0.4rem; }
    button.secondary { background: #2d3a4f; color: var(--text); }
    button.warn { background: #ffc857; color: #222; }
    #terminal {
      background: var(--term);
      border: none;
      border-radius: 0;
      padding: 0.5rem 0.75rem 0.65rem;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      font-size: 0.78rem;
      line-height: 1.45;
      white-space: pre-wrap;
      margin: 0;
      font-family: ui-monospace, monospace;
    }
    .success-link { display: none; margin-top: 1rem; padding: 1rem; background: #0d2818; border: 1px solid var(--accent); border-radius: 10px; text-align: center; }
    .success-link a { color: var(--accent); font-size: 1.05rem; font-weight: 700; text-decoration: none; word-break: break-all; }
    .approval-bar { display: none; margin-top: 0.75rem; padding: 0.75rem; background: #2a2210; border: 1px solid #ffc857; border-radius: 8px; }
    .chat-sidebar {
      padding: 0;
      font-family: var(--font-fa);
    }
    .chat-header { display: flex; align-items: center; justify-content: space-between; padding: 0.85rem 1rem; border-bottom: 1px solid #252b36; }
    .chat-title { font-size: 0.9rem; font-weight: 600; color: var(--text); }
    .chat-clear { background: transparent; color: var(--muted); font-size: 0.75rem; font-weight: 500; padding: 0.35rem 0.5rem; margin: 0; border-radius: 6px; }
    .chat-clear:hover { color: var(--text); background: #1a2230; }
    .chat-thread {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 1rem 1rem 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .chat-thread-empty { color: var(--muted); font-size: 0.85rem; line-height: 1.5; padding: 0.25rem 0; }
    .chat-user-bubble {
      align-self: stretch;
      background: #1a1f2a;
      border: 1px solid #2a3344;
      border-radius: 12px;
      padding: 0.65rem 0.85rem;
      font-family: var(--font-fa);
      font-size: 0.92rem;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
      direction: auto;
      unicode-bidi: plaintext;
      text-align: start;
    }
    .chat-agent-block {
      font-family: var(--font-fa);
      font-size: 0.92rem;
      font-weight: 400;
      line-height: 1.75;
      color: #d4dce8;
      direction: rtl;
      text-align: right;
      unicode-bidi: plaintext;
    }
    .chat-agent-block[dir="ltr"] { direction: ltr; text-align: left; }
    .chat-agent-block p { margin: 0 0 0.5rem; }
    .chat-agent-block p:last-child { margin-bottom: 0; }
    .chat-agent-block a { color: #6eb5ff; text-decoration: none; }
    .chat-agent-block a:hover { text-decoration: underline; }
    .chat-meta {
      font-size: 0.72rem;
      color: #6a7a92;
      margin-top: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      direction: ltr;
      justify-content: flex-end;
    }
    .chat-meta button.copy-btn { background: transparent; color: var(--muted); padding: 0.15rem 0.35rem; margin: 0; font-size: 0.7rem; font-weight: 500; border: 1px solid #2d3a4f; }
    .chat-meta button.copy-btn:hover { color: var(--text); }
    .chat-thinking { color: var(--muted); font-style: italic; }
    .chat-agent-streaming {
      color: #9aa3b2;
      white-space: pre-wrap;
    }
    .chat-agent-streaming strong { color: #a8b0be; font-weight: 600; }
    .chat-live-indicator { font-size: 0.72rem; color: #6eb5ff; margin-top: 0.35rem; }
    .chat-agent-block strong { color: #eef3fa; font-weight: 600; font-family: var(--font-fa); }
    .chat-thinking,
    .chat-live-indicator,
    .chat-thread-empty {
      font-family: var(--font-fa);
    }
    .chat-composer { border-top: 1px solid #252b36; padding: 0.75rem 1rem 1rem; margin-top: auto; background: #0d1219; }
    .chat-composer textarea {
      min-height: 72px;
      max-height: 160px;
      resize: none;
      border-radius: 12px;
      padding: 0.65rem 0.75rem;
      font-family: var(--font-fa);
      font-size: 0.92rem;
      line-height: 1.65;
      margin-top: 0;
      direction: auto;
      unicode-bidi: plaintext;
      text-align: start;
    }
    .composer-row { display: flex; align-items: center; justify-content: space-between; margin-top: 0.5rem; gap: 0.5rem; }
    .composer-hint { font-size: 0.7rem; color: #5c6b80; }
    .terminal-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      margin: 0;
      padding: 0;
      border-radius: 0;
      background: var(--term);
      border: none;
      border-top: 1px solid #2d3a4f;
    }
    .terminal-head {
      flex-shrink: 0;
      margin: 0;
      padding: 0.35rem 0.5rem 0.35rem 0.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      background: #12171f;
      border-bottom: 1px solid #252b36;
    }
    .terminal-title {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .terminal-to-cursor {
      margin: 0;
      padding: 0.25rem 0.55rem;
      font-size: 1rem;
      line-height: 1;
      font-weight: 700;
      background: #1a2535;
      color: var(--accent);
      border: 1px solid #2d4a3f;
      border-radius: 6px;
      cursor: pointer;
    }
    .terminal-to-cursor:hover:not(:disabled) {
      background: #1e2e42;
      border-color: var(--accent);
    }
    .terminal-to-cursor:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .terminal-wrap {
      flex: 0 0 auto;
      height: 340px;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
    }
    .terminal-resize-handle {
      flex-shrink: 0;
      height: 8px;
      margin: 0;
      cursor: ns-resize;
      position: relative;
      touch-action: none;
      background: transparent;
    }
    .terminal-resize-handle::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 1px;
      background: #2d3a4f;
    }
    .terminal-resize-handle:hover,
    .terminal-resize-handle.is-dragging {
      background: rgba(0, 212, 170, 0.12);
    }
    .terminal-resize-handle:hover::after,
    .terminal-resize-handle.is-dragging::after {
      background: var(--accent);
      height: 2px;
    }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="main-layout">
      <main class="left-panel">
        <header class="left-toolbar">
          <div class="repo-dropdown" id="repoDropdown">
            <button
              type="button"
              class="repo-dropdown-btn"
              id="repoDropdownBtn"
              aria-haspopup="listbox"
              aria-expanded="false"
            >Loading repositories…</button>
            <div class="repo-dropdown-menu" id="repoDropdownMenu" role="listbox" hidden></div>
          </div>
          <span id="runMeta" class="toolbar-meta"></span>
        </header>
        <div class="left-banners">
          <div class="approval-bar" id="approvalBar">
            <p><strong>Approval required</strong> — create Liara app and deploy.</p>
            <button type="button" class="warn" id="approveBtn">Approve &amp; continue</button>
          </div>
          <div class="success-link" id="successBox">
            <p>Your site is ready</p>
            <a id="siteLink" href="#" target="_blank" rel="noopener">Open site</a>
          </div>
        </div>
        <input type="hidden" id="apiKey" value="dev-local-key" />
        <input type="hidden" id="ghSubpath" value="" />
        <input type="hidden" id="liaraApp" value="" />
        <select id="ghRepo" class="visually-hidden" tabindex="-1" aria-hidden="true">
          <option value="">Loading…</option>
        </select>

        <section class="cursor-panel" id="cursorPanel" aria-label="Cursor SDK">
          <div class="cursor-panel-header">
            <span class="cursor-panel-title">Cursor</span>
            <span class="cursor-status" id="cursorStatus">Checking API…</span>
            <button type="button" id="cursorNewSession" title="New session">New chat</button>
          </div>
          <div class="cursor-thread" id="cursorThread" aria-live="polite">
            <p class="cursor-thread-empty">Local agent on your repo clone. Terminal ↑ attaches deploy logs. Progress appears in the chat while Cursor works.</p>
          </div>
          <div class="cursor-composer">
            <div class="cursor-composer-row">
              <textarea id="cursorInput" rows="2" placeholder="Message Cursor…"></textarea>
              <button type="button" id="cursorSend" class="composer-send-btn" aria-label="Send" title="Send"></button>
            </div>
          </div>
        </section>

        <div class="terminal-dock" id="terminalDock">
          <div
            class="terminal-resize-handle"
            id="terminalResizeHandle"
            role="separator"
            aria-orientation="horizontal"
            aria-label="Resize terminal"
            title="Drag up to make the terminal taller"
          ></div>
          <div class="terminal-wrap" id="terminalWrap">
            <div class="card terminal-card">
              <div class="terminal-head">
                <span class="terminal-title">Terminal</span>
                <button
                  type="button"
                  id="terminalToCursor"
                  class="terminal-to-cursor"
                  title="Send terminal output to Cursor"
                  aria-label="Send terminal output to Cursor"
                >↑</button>
              </div>
              <div id="terminal"></div>
            </div>
          </div>
        </div>
      </main>

      <aside class="right-sidebar chat-sidebar">
        <div class="chat-header">
          <span class="chat-title">Agent</span>
          <button type="button" class="chat-clear" id="chatClear" title="Clear conversation">Clear</button>
        </div>
        <div class="chat-thread" id="chatThread"></div>
        <div class="chat-composer">
          <textarea id="message" rows="3" placeholder="Deploy, logs, health checks…"></textarea>
          <div class="composer-row">
            <span class="composer-hint">Enter to send · Shift+Enter for newline</span>
            <button type="button" id="chatSend" class="composer-send-btn" aria-label="Send" title="Send"></button>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <script>
    let currentRunId = null;
    let eventSource = null;
    let runPollTimer = null;
    let chatPendingTurn = null;
    let agentStreamActive = false;
    let agentThinkingText = '';
    function composerSendIconHtml() {
      return '<svg class="icon-send" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V6M12 6l-5.5 5M12 6l5.5 5"/></svg>';
    }
    function composerStopIconHtml() {
      return '<svg class="icon-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="8" height="8" rx="1.5"/></svg>';
    }
    function setComposerSendButton(btn, mode) {
      if (!btn) return;
      const stop = mode === 'stop';
      btn.classList.toggle('is-stop', stop);
      btn.dataset.mode = stop ? 'stop' : 'send';
      btn.setAttribute('aria-label', stop ? 'Stop' : 'Send');
      btn.title = stop ? 'Stop' : 'Send';
      btn.innerHTML = stop ? composerStopIconHtml() : composerSendIconHtml();
    }
    function initComposerSendButtons() {
      setComposerSendButton(document.getElementById('cursorSend'), 'send');
      setComposerSendButton(document.getElementById('chatSend'), 'send');
    }
    initComposerSendButtons();

    const CHAT_STORAGE_KEY = 'deployer_chat_v1';
    const CHAT_MAX_TURNS = 20;
    const REPO_STORAGE_KEY = 'deployer_selected_repo';
    const CURSOR_SESSION_KEY = 'deployer_cursor_session_id';
    const CURSOR_LOG_MAX = 48000;

    const apiKey = () => document.getElementById('apiKey').value;
    const headers = () => ({ 'Content-Type': 'application/json', 'X-API-Key': apiKey() });

    function showSavedRepoFromCache() {
      const saved = (localStorage.getItem(REPO_STORAGE_KEY) || '').trim();
      if (!saved) return;
      const btn = document.getElementById('repoDropdownBtn');
      if (btn) btn.textContent = saved + ' ▾';
      const app = saved.includes('/') ? saved.split('/').pop() : '';
      const appEl = document.getElementById('liaraApp');
      if (app && appEl) appEl.value = app;
    }

    function healChatMemoryOnLoad() {
      const memory = loadChatMemory();
      if (!memory.length) return;
      const now = Date.now();
      let changed = false;
      for (const turn of memory) {
        if (!turn.pending) continue;
        const age = now - (turn.startedAt || turn.at || 0);
        if (age < 90000) continue;
        turn.pending = false;
        turn.agentLive = false;
        turn.streaming = false;
        if (turn.assistant === 'Thinking…' || !turn.assistant?.trim()) {
          turn.assistant = 'Previous run was interrupted (page refresh). You can send a new message.';
        }
        changed = true;
      }
      if (changed) saveChatMemory(memory);
    }

    showSavedRepoFromCache();

    function bootPageIntegrations() {
      void loadRepos();
      void refreshCursorStatus();
      syncTerminalToCursorButton();
    }
    queueMicrotask(bootPageIntegrations);

    function getTerminalLog() {
      const text = (document.getElementById('terminal').textContent || '').trim();
      if (!text) return '';
      return text.length > CURSOR_LOG_MAX ? text.slice(-CURSOR_LOG_MAX) : text;
    }

    function term(line) {
      const el = document.getElementById('terminal');
      el.textContent += line + '\n';
      el.scrollTop = el.scrollHeight;
      syncTerminalToCursorButton();
    }

    function clearTerm() {
      document.getElementById('terminal').textContent = '';
      syncTerminalToCursorButton();
    }

    function syncTerminalToCursorButton() {
      const btn = document.getElementById('terminalToCursor');
      if (btn) btn.disabled = !getTerminalLog();
    }

    function loadChatMemory() {
      try {
        const raw = sessionStorage.getItem(CHAT_STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (_) { return []; }
    }

    function saveChatMemory(items) {
      sessionStorage.setItem(CHAT_STORAGE_KEY, JSON.stringify(items.slice(-CHAT_MAX_TURNS)));
    }

    function formatTimeAgo(ts) {
      const s = Math.floor((Date.now() - ts) / 1000);
      if (s < 15) return 'just now';
      if (s < 60) return s + 's ago';
      const m = Math.floor(s / 60);
      if (m < 60) return m + 'm ago';
      return Math.floor(m / 60) + 'h ago';
    }

    function formatDuration(ms) {
      if (!ms || ms < 500) return 'a moment';
      const s = Math.round(ms / 1000);
      if (s < 60) return s + 's';
      const m = Math.floor(s / 60);
      const rs = s % 60;
      return rs ? m + 'm ' + rs + 's' : m + 'm';
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function linkifyText(text) {
      const escaped = escapeHtml(text);
      return escaped.replace(
        /(https?:\/\/[^\s<]+)/g,
        '<a href="$1" target="_blank" rel="noopener">$1</a>'
      );
    }

    function hasPersianOrArabic(text) {
      return /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF]/.test(text || '');
    }

    function applyAgentDirection(el, text) {
      if (!el) return;
      if (hasPersianOrArabic(text)) {
        el.setAttribute('dir', 'rtl');
        el.removeAttribute('data-ltr');
      } else {
        el.setAttribute('dir', 'ltr');
        el.setAttribute('data-ltr', '1');
      }
    }

    function formatAgentText(text) {
      return linkifyText(text).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    }

    function renderChatThread() {
      const thread = document.getElementById('chatThread');
      const memory = loadChatMemory();
      thread.innerHTML = '';
      if (!memory.length && !chatPendingTurn) {
        thread.innerHTML = '<div class="chat-thread-empty">Ask me to deploy from GitHub, check logs, or diagnose an incident. I remember this session’s last few messages.</div>';
        return;
      }
      memory.forEach((turn, idx) => {
        if (turn.user) {
          const u = document.createElement('div');
          u.className = 'chat-user-bubble';
          u.setAttribute('dir', 'auto');
          u.textContent = turn.user;
          thread.appendChild(u);
        }
        if (turn.assistant != null) {
          const block = document.createElement('div');
          block.className = 'chat-agent-block';
          const body = document.createElement('div');
          const isThinkingOnly = turn.pending && turn.assistant === 'Thinking…';
          const isLiveText =
            turn.streaming ||
            (turn.pending && turn.assistant !== 'Thinking…') ||
            (turn.agentLive && agentStreamActive && !turn.durationMs);
          if (isThinkingOnly) {
            body.className = 'chat-thinking';
            body.textContent = turn.assistant;
          } else {
            body.className = isLiveText ? 'chat-agent-streaming' : '';
            body.innerHTML = formatAgentText(turn.assistant);
            applyAgentDirection(body, turn.assistant);
          }
          block.appendChild(body);
          applyAgentDirection(block, turn.assistant);
          if (turn.agentLive && agentStreamActive && agentThinkingText) {
            const live = document.createElement('div');
            live.className = 'chat-live-indicator';
            live.textContent = agentThinkingText;
            block.appendChild(live);
          } else if (turn.agentLive && agentStreamActive) {
            const live = document.createElement('div');
            live.className = 'chat-live-indicator';
            live.textContent = 'Agent is working…';
            block.appendChild(live);
          }
          const meta = document.createElement('div');
          meta.className = 'chat-meta';
          const label = turn.durationMs
            ? 'Worked for ' + formatDuration(turn.durationMs)
            : (turn.pending || (turn.agentLive && agentStreamActive) ? 'Working…' : '');
          meta.innerHTML = '<span>' + (label ? label + ' · ' : '') + formatTimeAgo(turn.at || Date.now()) + '</span>';
          if (!turn.pending && turn.assistant) {
            const copy = document.createElement('button');
            copy.type = 'button';
            copy.className = 'copy-btn';
            copy.textContent = 'Copy';
            copy.onclick = () => navigator.clipboard.writeText(turn.assistant);
            meta.appendChild(copy);
          }
          block.appendChild(meta);
          thread.appendChild(block);
        }
      });
      if (chatPendingTurn && (memory.length === 0 || memory[memory.length - 1] !== chatPendingTurn)) {
        if (chatPendingTurn.user) {
          const u = document.createElement('div');
          u.className = 'chat-user-bubble';
          u.setAttribute('dir', 'auto');
          u.textContent = chatPendingTurn.user;
          thread.appendChild(u);
        }
        const block = document.createElement('div');
        block.className = 'chat-agent-block';
        block.innerHTML = '<div class="chat-thinking">' + escapeHtml(chatPendingTurn.assistant || 'Thinking…') + '</div>';
        thread.appendChild(block);
      }
      thread.scrollTop = thread.scrollHeight;
    }

    function appendChatTurn(userText) {
      const memory = loadChatMemory();
      const turn = { user: userText, assistant: 'Thinking…', pending: true, at: Date.now(), startedAt: Date.now() };
      memory.push(turn);
      saveChatMemory(memory);
      chatPendingTurn = null;
      renderChatThread();
      return memory.length - 1;
    }

    function finishChatTurn(assistantText, extra) {
      const memory = loadChatMemory();
      for (let i = memory.length - 1; i >= 0; i--) {
        if (memory[i].pending) {
          memory[i].pending = false;
          memory[i].streaming = false;
          memory[i].assistant = assistantText || memory[i].assistant;
          memory[i].at = Date.now();
          memory[i].durationMs = extra?.durationMs ?? (Date.now() - (memory[i].startedAt || memory[i].at));
          if (extra) Object.assign(memory[i], extra);
          saveChatMemory(memory);
          renderChatThread();
          return;
        }
      }
      if (!assistantText || !memory.length) return;
      const last = memory[memory.length - 1];
      if (!last.pending && last.user) {
        last.assistant = assistantText;
        last.at = Date.now();
        if (extra?.durationMs) last.durationMs = extra.durationMs;
        saveChatMemory(memory);
        renderChatThread();
      }
    }

    function patchLatestAssistant(text) {
      const memory = loadChatMemory();
      for (let i = memory.length - 1; i >= 0; i--) {
        if (memory[i].assistant != null) {
          const base = memory[i].assistant === 'Thinking…' ? '' : memory[i].assistant;
          memory[i].assistant = text || base;
          if (!memory[i].pending) memory[i].at = Date.now();
          saveChatMemory(memory);
          renderChatThread();
          return;
        }
      }
    }

    function isStreamingSkill(skillId) {
      return !!skillId && (skillId.startsWith('liara.') || skillId === 'agent.summarize' || skillId === 'agent.chat');
    }

    function stripAnsi(s) {
      return (s || '').replace(/\x1b\[[0-9;]*m/g, '');
    }

    function deployChatLineFromLog(line) {
      const t = stripAnsi(line).trim();
      if (!t) return '';
      if (t.startsWith('— Liara CLI') || t.startsWith('— Liara build')) return t;
      if (/installing dependencies using pip/i.test(t)) {
        return 'Liara: installing Python packages (first build can take several minutes)…';
      }
      if (/^Collecting sqlalchemy/i.test(t)) return 'Liara: downloading SQLAlchemy (large package, please wait)…';
      if (/deployment finished successfully/i.test(t)) return t;
      if (/build finished|upload finished|release created|creating an archive|checking container/i.test(t)) return t;
      if (/^https?:\/\//i.test(t)) return t;
      if (/\.liara\.run/i.test(t)) return t;
      if (/^> (Fetching|Pulling|Preparing|Building)/i.test(t)) return t;
      if (/^Step \d+\//i.test(t)) return t;
      if (/^(App:|Path:|Platform:|Port:)/i.test(t)) return t;
      return '';
    }

    function syncChatWithLogLine(line) {
      const memory = loadChatMemory();
      if (!memory.length) return;
      const turn = memory[memory.length - 1];
      if (!turn.pending && !turn.agentLive) return;
      const milestone = deployChatLineFromLog(line);
      const preview = milestone || stripAnsi(line).trim().slice(0, 140);
      if (!preview) return;
      if (turn.assistant === 'Thinking…') {
        turn.assistant = 'Deploy in progress…\n\n' + (milestone || preview);
      } else if (milestone && !turn.assistant.includes(milestone)) {
        turn.assistant = turn.assistant + '\n' + milestone;
      } else if (!milestone) {
        const lines = turn.assistant.split('\n');
        const last = lines[lines.length - 1] || '';
        if (last.startsWith('… ') || last.length < 120) {
          lines[lines.length - 1] = '… ' + preview;
        } else {
          lines.push('… ' + preview);
        }
        turn.assistant = lines.join('\n');
      }
      turn.agentLive = true;
      turn.pending = true;
      turn.at = Date.now();
      saveChatMemory(memory);
      renderChatThread();
    }

    function appendStreamTokenToLatestAssistant(delta, streamStart, newBlock, replace) {
      if (!delta && !streamStart) return;
      const memory = loadChatMemory();
      for (let i = memory.length - 1; i >= 0; i--) {
        if (memory[i].assistant != null) {
          memory[i].pending = false;
          memory[i].agentLive = true;
          memory[i].streaming = true;
          let base = memory[i].assistant === 'Thinking…' ? '' : memory[i].assistant;
          if (streamStart && replace) base = '';
          if (streamStart) {
            if (newBlock && base) base += '\n\n';
            memory[i].assistant = base + (delta || '');
          } else {
            memory[i].assistant = base + (delta || '');
          }
          memory[i].at = Date.now();
          saveChatMemory(memory);
          renderChatThread();
          return;
        }
      }
    }

    function appendToLatestAssistant(text) {
      if (!text) return;
      const memory = loadChatMemory();
      for (let i = memory.length - 1; i >= 0; i--) {
        if (memory[i].assistant != null) {
          memory[i].pending = false;
          memory[i].agentLive = true;
          const base = memory[i].assistant === 'Thinking…' ? '' : memory[i].assistant;
          memory[i].assistant = base ? (base + '\n\n' + text).trim() : text;
          memory[i].at = Date.now();
          saveChatMemory(memory);
          renderChatThread();
          return;
        }
      }
    }

    function setAgentThinking(text) {
      agentThinkingText = text || '';
      renderChatThread();
    }

    function chatHistoryForApi() {
      const memory = loadChatMemory();
      const out = [];
      memory.forEach((turn, idx) => {
        const isCurrentPending = turn.pending && idx === memory.length - 1;
        if (isCurrentPending) return;
        if (turn.user) out.push({ role: 'user', content: turn.user });
        if (turn.assistant && turn.assistant !== 'Thinking…') {
          out.push({ role: 'assistant', content: turn.assistant });
        }
      });
      return out.slice(-12);
    }

    healChatMemoryOnLoad();
    requestAnimationFrame(() => renderChatThread());

    function closeRepoMenu() {
      const menu = document.getElementById('repoDropdownMenu');
      menu.hidden = true;
      document.getElementById('repoDropdownBtn').setAttribute('aria-expanded', 'false');
    }

    function toggleRepoMenu() {
      const menu = document.getElementById('repoDropdownMenu');
      const willOpen = menu.hidden;
      menu.hidden = !willOpen;
      document.getElementById('repoDropdownBtn').setAttribute('aria-expanded', willOpen ? 'true' : 'false');
    }

    function cursorSessionId() {
      return sessionStorage.getItem(CURSOR_SESSION_KEY) || '';
    }

    function setCursorSessionId(id) {
      if (id) sessionStorage.setItem(CURSOR_SESSION_KEY, id);
      else sessionStorage.removeItem(CURSOR_SESSION_KEY);
    }

    let cursorStreamEl = null;
    let cursorStreamBody = null;
    let cursorActivityEl = null;
    let cursorHeartbeatTimer = null;
    let cursorStickToBottom = true;
    let cursorChatInFlight = false;
    let cursorStreamGeneration = 0;
    let cursorStreamAbort = null;
    let agentChatInFlight = false;
    let agentChatAbort = null;

    const CURSOR_RTL_RE = /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]/;

    function scrollCursorThread(opts) {
      const force = !!(opts && opts.force);
      const smooth = !!(opts && opts.smooth);
      const thread = document.getElementById('cursorThread');
      if (!thread) return;
      const threshold = 72;
      const atBottom =
        thread.scrollHeight - thread.scrollTop - thread.clientHeight <= threshold;
      if (!force && !cursorStickToBottom && !atBottom) return;
      if (force) cursorStickToBottom = true;
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          thread.scrollTo({
            top: thread.scrollHeight,
            behavior: smooth ? 'smooth' : 'auto',
          });
        });
      });
    }

    (function initCursorThreadScroll() {
      const thread = document.getElementById('cursorThread');
      if (!thread) return;
      thread.addEventListener(
        'scroll',
        () => {
          const threshold = 72;
          cursorStickToBottom =
            thread.scrollHeight - thread.scrollTop - thread.clientHeight <= threshold;
        },
        { passive: true },
      );
    })();

    function applyCursorTextDir(el, text) {
      if (!el) return;
      const rtl = CURSOR_RTL_RE.test(text || '');
      el.dir = rtl ? 'rtl' : 'auto';
    }

    function appendCursorMsg(role, text) {
      const thread = document.getElementById('cursorThread');
      thread.querySelector('.cursor-thread-empty')?.remove();
      const div = document.createElement('div');
      div.className = 'cursor-msg ' + role;
      div.textContent = text;
      applyCursorTextDir(div, text);
      thread.appendChild(div);
      scrollCursorThread({ force: true, smooth: role === 'user' });
      return div;
    }

    function cursorStreamNode(streamGen) {
      if (streamGen != null) {
        if (cursorStreamEl && cursorStreamEl.dataset.streamGen === String(streamGen)) {
          return cursorStreamEl;
        }
        return document.querySelector('.cursor-msg.streaming[data-stream-gen="' + streamGen + '"]');
      }
      return cursorStreamEl;
    }

    function isTransientCursorError(text) {
      const t = (text || '').toLowerCase();
      return (
        t.includes('bridge request failed') ||
        t.includes('not found') ||
        t.includes('10061') ||
        t.includes('connection refused') ||
        t.includes('connecterror')
      );
    }

    function beginCursorStream() {
      const gen = ++cursorStreamGeneration;
      cursorStreamEl = appendCursorMsg('assistant', '');
      cursorStreamEl.dataset.streamGen = String(gen);
      cursorStreamEl.classList.add('streaming');
      cursorStreamEl.textContent = '';
      cursorActivityEl = document.createElement('div');
      cursorActivityEl.className = 'cursor-activity';
      cursorStreamBody = document.createElement('div');
      cursorStreamBody.className = 'cursor-stream-body';
      cursorStreamEl.appendChild(cursorActivityEl);
      cursorStreamEl.appendChild(cursorStreamBody);
      pushCursorActivity('Connecting…');
      scrollCursorThread({ force: true, smooth: true });
      return gen;
    }

    function pushCursorActivity(text) {
      if (!cursorActivityEl || !text) return;
      const line = text.trim();
      if (!line) return;
      const prev = cursorActivityEl.textContent.trim();
      if (prev.endsWith(line)) return;
      const lines = prev ? prev.split('\n').filter(Boolean) : [];
      lines.push(line);
      while (lines.length > 3) lines.shift();
      cursorActivityEl.textContent = lines.join('\n');
      scrollCursorThread({ smooth: true });
    }

    function appendCursorStreamDelta(text) {
      if (!cursorStreamBody || !text) return;
      cursorStreamBody.textContent += text;
      applyCursorTextDir(cursorStreamBody, cursorStreamBody.textContent);
      if (cursorStreamEl) applyCursorTextDir(cursorStreamEl, cursorStreamBody.textContent);
      scrollCursorThread({ smooth: true });
    }

    function stopCursorHeartbeat() {
      if (cursorHeartbeatTimer) {
        clearInterval(cursorHeartbeatTimer);
        cursorHeartbeatTimer = null;
      }
    }

    function startCursorHeartbeat() {
      stopCursorHeartbeat();
      cursorHeartbeatTimer = setInterval(() => {
        pushCursorActivity('Still working — tools may take several minutes…');
      }, 40000);
    }

    function endCursorStream(ok, reply, errText, streamGen) {
      stopCursorHeartbeat();
      const el = cursorStreamNode(streamGen);
      const body = el ? el.querySelector('.cursor-stream-body') : cursorStreamBody;
      const activity = el ? el.querySelector('.cursor-activity') : cursorActivityEl;
      const streamed = (body && body.textContent || '').trim();
      let finalOk = !!ok;
      let finalText = (reply || '').trim();
      const err = (errText || '').trim();
      if (!finalOk) {
        if (streamed && (finalText ? streamed.length >= finalText.length * 0.4 : true)) {
          if (!finalText || streamed.length >= finalText.length) finalText = streamed;
          else finalText = finalText || streamed;
          finalOk = true;
        } else if (streamed && isTransientCursorError(err)) {
          finalText = streamed;
          finalOk = true;
        } else {
          finalText = err || finalText || 'Cursor run failed';
        }
      }
      if (!el) {
        if (!finalOk) appendCursorMsg('error', finalText || 'Cursor run failed');
        else if (finalText) appendCursorMsg('assistant', finalText);
        return;
      }
      el.classList.remove('streaming');
      if (!finalOk) {
        el.classList.add('error');
        el.classList.remove('assistant');
        if (activity) activity.remove();
        if (body) {
          body.textContent = finalText || 'Cursor run failed';
          applyCursorTextDir(body, body.textContent);
        } else {
          el.textContent = finalText || 'Cursor run failed';
          applyCursorTextDir(el, el.textContent);
        }
      } else if (finalText) {
        if (activity) activity.remove();
        if (body) {
          body.textContent = finalText;
          applyCursorTextDir(body, finalText);
          applyCursorTextDir(el, finalText);
        } else {
          el.textContent = finalText;
          applyCursorTextDir(el, finalText);
        }
      }
      scrollCursorThread({ force: true, smooth: true });
      if (el === cursorStreamEl) {
        cursorStreamEl = null;
        cursorStreamBody = null;
        cursorActivityEl = null;
      }
    }

    function consumeSseBuffer(buffer, onEvent) {
      const blocks = buffer.split('\n\n');
      const rest = blocks.pop() || '';
      for (const block of blocks) {
        if (!block.trim()) continue;
        let ev = 'message';
        let dataLine = '';
        for (const line of block.split('\n')) {
          if (line.startsWith('event:')) ev = line.slice(6).trim();
          else if (line.startsWith('data:')) dataLine = line.slice(5).trim();
        }
        if (!dataLine) continue;
        try {
          onEvent(ev, JSON.parse(dataLine));
        } catch (_) {}
      }
      return rest;
    }

    async function refreshCursorStatus() {
      const el = document.getElementById('cursorStatus');
      try {
        const res = await fetch('/cursor/status', { headers: { 'X-API-Key': apiKey() } });
        const data = await res.json();
        if (data.configured) {
          const rt = (data.runtime || 'local') === 'cloud' ? 'Cloud' : 'Local';
          el.textContent = rt + ' · ' + (data.model || 'composer-2.5');
        } else {
          el.textContent = 'API key missing';
        }
      } catch (_) {
        el.textContent = 'Could not reach Cursor status endpoint';
      }
    }

    const CURSOR_DEFAULT_FROM_TERMINAL =
      'Using the deployment log below: identify the root cause, apply minimal fixes in cwd, and summarize what you changed. Run build only if needed to verify.';

    async function fetchServerTerminalLog() {
      const q = currentRunId ? ('?run_id=' + encodeURIComponent(currentRunId)) : '';
      try {
        const res = await fetch('/terminal/log' + q, { headers: { 'X-API-Key': apiKey() } });
        if (!res.ok) return '';
        const data = await res.json();
        return (data.text || '').trim();
      } catch (_) {
        return '';
      }
    }

    function stopCursorChat() {
      if (cursorStreamAbort) cursorStreamAbort.abort();
    }

    async function sendCursorChat(options = {}) {
      const input = document.getElementById('cursorInput');
      const useServerLog = !!options.useServerTerminalLog;
      const attachLog = options.attachLog !== false;
      let msg = (options.message != null ? options.message : input.value).trim();
      if (!msg) return false;
      if (options.message == null) input.value = '';

      let deployLog = null;
      let logLineCount = 0;
      if (useServerLog || (attachLog && currentRunId)) {
        deployLog = await fetchServerTerminalLog();
        logLineCount = deployLog ? deployLog.split('\n').length : 0;
      }
      if (!deployLog && attachLog) {
        deployLog = options.deployLog != null ? options.deployLog : getTerminalLog();
        logLineCount = deployLog ? deployLog.split('\n').length : 0;
      }
      const includeTerminalLog = !!(useServerLog || (attachLog && currentRunId && deployLog));

      const userLabel = deployLog && options.fromTerminal
        ? msg + '\n\n↳ terminal log (' + logLineCount + ' lines from server)'
        : msg;
      appendCursorMsg('user', userLabel);
      let streamGen = beginCursorStream();
      startCursorHeartbeat();

      const btn = document.getElementById('cursorSend');
      const termBtn = document.getElementById('terminalToCursor');
      if (termBtn) termBtn.disabled = true;
      cursorChatInFlight = true;
      cursorStreamAbort = new AbortController();
      setComposerSendButton(btn, 'stop');
      btn.disabled = false;
      const repo = document.getElementById('ghRepo').value.trim() || null;
      let donePayload = null;
      try {
        const res = await fetch('/cursor/chat/stream', {
          method: 'POST',
          headers: headers(),
          signal: cursorStreamAbort.signal,
          body: JSON.stringify({
            message: msg,
            session_id: cursorSessionId() || null,
            run_id: currentRunId || null,
            repo,
            deploy_log: includeTerminalLog ? null : (deployLog || null),
            include_terminal_log: includeTerminalLog,
          }),
        });
        if (!res.ok || !res.body) {
          const raw = await res.text();
          endCursorStream(false, '', raw.slice(0, 500) || ('HTTP ' + res.status), streamGen);
        } else {
          const reader = res.body.getReader();
          const dec = new TextDecoder();
          let sseBuf = '';
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            sseBuf = consumeSseBuffer(sseBuf + dec.decode(value, { stream: true }), (ev, data) => {
              if (ev === 'session' && data.session_id) setCursorSessionId(data.session_id);
              if (ev === 'status' && data.text) pushCursorActivity(data.text);
              if (ev === 'activity' && data.text) pushCursorActivity(data.text);
              if (ev === 'delta' && data.text) appendCursorStreamDelta(data.text);
              if (ev === 'final' && data.text) {
                if (cursorStreamBody) {
                  cursorStreamBody.textContent = data.text;
                  applyCursorTextDir(cursorStreamBody, data.text);
                  if (cursorStreamEl) applyCursorTextDir(cursorStreamEl, data.text);
                }
              }
              if (ev === 'error' && data.text) pushCursorActivity(data.text);
              if (ev === 'done') donePayload = data;
            });
          }
          if (donePayload) {
            if (donePayload.session_id) setCursorSessionId(donePayload.session_id);
            endCursorStream(
              !!donePayload.ok,
              donePayload.reply || '',
              donePayload.ok ? '' : (donePayload.error || 'Cursor run failed'),
              streamGen,
            );
            if (donePayload.workspace) {
              const ws = String(donePayload.workspace);
              const label = ws.startsWith('cloud:') ? ws : ws.split(/[/\\]/).pop();
              document.getElementById('cursorStatus').textContent = 'Workspace · ' + label;
            }
          } else {
            endCursorStream(false, '', 'Stream ended without a result', streamGen);
          }
        }
      } catch (e) {
        const stopped = e && e.name === 'AbortError';
        endCursorStream(false, '', stopped ? 'Stopped.' : String(e.message || e), streamGen);
      } finally {
        cursorChatInFlight = false;
        cursorStreamAbort = null;
        stopCursorHeartbeat();
        btn.disabled = false;
        setComposerSendButton(btn, 'send');
        syncTerminalToCursorButton();
      }
      return true;
    }

    async function sendTerminalToCursor() {
      const serverLog = await fetchServerTerminalLog();
      const uiLog = getTerminalLog();
      if (!serverLog && !uiLog) return;
      const input = document.getElementById('cursorInput');
      const msg = input.value.trim() || CURSOR_DEFAULT_FROM_TERMINAL;
      if (!input.value.trim()) input.value = '';
      await sendCursorChat({
        message: msg,
        fromTerminal: true,
        useServerTerminalLog: true,
        deployLog: uiLog && !serverLog ? uiLog : null,
      });
    }

    function newCursorSession() {
      const sid = cursorSessionId();
      if (sid) {
        fetch('/cursor/session/' + encodeURIComponent(sid), {
          method: 'DELETE',
          headers: { 'X-API-Key': apiKey() },
        }).catch(() => {});
      }
      setCursorSessionId('');
      document.getElementById('cursorThread').innerHTML =
        '<p class="cursor-thread-empty">New chat — terminal ↑ attaches deploy logs when you send.</p>';
      refreshCursorStatus();
    }

    document.getElementById('cursorSend').onclick = () => {
      if (cursorChatInFlight) {
        stopCursorChat();
        return;
      }
      sendCursorChat();
    };
    document.getElementById('terminalToCursor').onclick = () => { sendTerminalToCursor(); };
    document.getElementById('cursorNewSession').onclick = newCursorSession;
    document.getElementById('cursorInput').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendCursorChat();
      }
    });

    function setSelectedRepo(fullName) {
      const sel = document.getElementById('ghRepo');
      if (fullName && [...sel.options].some(o => o.value === fullName)) {
        sel.value = fullName;
      } else if (!fullName) {
        sel.value = '';
      }
      localStorage.setItem(REPO_STORAGE_KEY, fullName || '');
      const btn = document.getElementById('repoDropdownBtn');
      btn.textContent = fullName ? fullName + ' ▾' : 'Select repository ▾';
      const app =
        fullName && fullName.includes('/') ? fullName.split('/').pop() : '';
      document.getElementById('liaraApp').value = app || '';
      document.querySelectorAll('.repo-dropdown-item[data-repo]').forEach(el => {
        el.classList.toggle('is-selected', el.dataset.repo === fullName);
      });
    }

    let reposLoadInFlight = false;

    async function loadRepos() {
      if (reposLoadInFlight) return;
      reposLoadInFlight = true;
      const btn = document.getElementById('repoDropdownBtn');
      const prev = document.getElementById('ghRepo').value || localStorage.getItem(REPO_STORAGE_KEY) || '';
      if (!prev) btn.textContent = 'Loading repositories…';
      let data;
      try {
        const res = await fetch('/integrations/github/repos', {
          headers: { 'X-API-Key': apiKey() },
          signal: AbortSignal.timeout(25000),
        });
        data = await res.json();
        if (!res.ok) {
          const detail = typeof data.detail === 'string' ? data.detail : ('HTTP ' + res.status);
          btn.textContent = prev ? prev + ' ▾' : 'Repo load failed ▾';
          term('GitHub repos: ' + detail);
          reposLoadInFlight = false;
          return;
        }
      } catch (e) {
        btn.textContent = prev ? prev + ' ▾' : 'Repo load failed ▾';
        const msg = e.name === 'TimeoutError' ? 'GitHub repos timed out (server busy?)' : (e.message || e);
        term('GitHub repos: ' + msg);
        reposLoadInFlight = false;
        return;
      }
      const sel = document.getElementById('ghRepo');
      const menu = document.getElementById('repoDropdownMenu');
      sel.innerHTML = '';
      menu.innerHTML = '';
      const repos = data.repos || [];
      if (!repos.length) {
        const o = document.createElement('option');
        o.value = '';
        o.textContent = 'No repositories';
        sel.appendChild(o);
        btn.textContent = 'No repositories ▾';
        const empty = document.createElement('div');
        empty.className = 'repo-dropdown-item';
        empty.style.pointerEvents = 'none';
        empty.style.color = 'var(--muted)';
        empty.textContent = 'No repositories found';
        menu.appendChild(empty);
      } else {
        repos.forEach(r => {
          const o = document.createElement('option');
          o.value = r.full_name;
          o.textContent = r.full_name;
          sel.appendChild(o);
          const item = document.createElement('button');
          item.type = 'button';
          item.className = 'repo-dropdown-item';
          item.dataset.repo = r.full_name;
          item.textContent = r.full_name;
          item.onclick = () => {
            setSelectedRepo(r.full_name);
            closeRepoMenu();
          };
          menu.appendChild(item);
        });
        const refresh = document.createElement('button');
        refresh.type = 'button';
        refresh.className = 'repo-dropdown-item repo-dropdown-refresh';
        refresh.textContent = '↻ Refresh list';
        refresh.onclick = () => loadRepos();
        menu.appendChild(refresh);
        const pick =
          prev && repos.some(r => r.full_name === prev) ? prev : repos[0].full_name;
        setSelectedRepo(pick);
      }
      reposLoadInFlight = false;
    }

    document.getElementById('repoDropdownBtn').addEventListener('click', e => {
      e.stopPropagation();
      toggleRepoMenu();
    });
    document.addEventListener('click', e => {
      if (!e.target.closest('.repo-dropdown')) closeRepoMenu();
    });

    function connectStream(runId) {
      if (eventSource) eventSource.close();
      agentStreamActive = true;
      agentThinkingText = '';
      const url = '/runs/' + runId + '/stream?api_key=' + encodeURIComponent(apiKey());
      eventSource = new EventSource(url);
      eventSource.addEventListener('connected', () => term('— stream connected —'));
      eventSource.addEventListener('log_line', e => {
        const d = JSON.parse(e.data);
        const line = d.line || '';
        term(line);
        syncChatWithLogLine(line);
      });
      eventSource.addEventListener('step_start', e => {
        const d = JSON.parse(e.data);
        term('>>> step ' + d.name);
      });
      eventSource.addEventListener('tool_call', e => {
        const d = JSON.parse(e.data);
        term('>>> tool ' + (d.tool_id || ''));
        if (d.tool_id === 'liara.deploy_service') {
          syncChatWithLogLine('Starting Liara deploy (live output in terminal)…');
        }
      });
      eventSource.addEventListener('agent_message', e => {
        const d = JSON.parse(e.data);
        const text = d.text || '';
        if (d.stream) {
          appendStreamTokenToLatestAssistant(text, !!d.stream_start, !!d.new_block, !!d.replace);
          return;
        }
        if (d.append) appendToLatestAssistant(text);
        else if (text) {
          const pending = loadChatMemory().some(t => t.pending);
          if (pending) setAgentThinking(text);
          else patchLatestAssistant(text);
        }
        if (text && !d.stream) term('Agent: ' + text);
      });
      eventSource.addEventListener('agent_thinking', e => {
        const d = JSON.parse(e.data);
        const text = d.text || '';
        setAgentThinking(text);
        if (text) syncChatWithLogLine(text);
      });
      eventSource.addEventListener('approval_required', e => {
        const d = JSON.parse(e.data);
        term('');
        term('*** APPROVAL REQUIRED: ' + (d.message || '') + ' ***');
        document.getElementById('approvalBar').style.display = 'block';
        appendToLatestAssistant('Approval required — use **Approve & continue** on the left panel.');
      });
      eventSource.addEventListener('site_url', e => {
        const d = JSON.parse(e.data);
        if (d.url) {
          showSite(d.url);
          const mem = loadChatMemory();
          if (mem.length && mem[mem.length - 1].pending) {
            const line = 'Deploy finished — site: ' + d.url;
            if (!mem[mem.length - 1].assistant.includes(d.url)) {
              mem[mem.length - 1].assistant = line;
              saveChatMemory(mem);
              renderChatThread();
            }
          }
        }
      });
      eventSource.addEventListener('succeeded', e => {
        const d = JSON.parse(e.data);
        if (d.site_url) showSite(d.site_url);
        const m = loadChatMemory();
        const summary = (d.summary || '').trim();
        if (m.length) {
          const last = m[m.length - 1];
          const stuck =
            last.pending ||
            last.assistant === 'Thinking…' ||
            !(last.assistant && last.assistant.trim());
          if (summary && (stuck || !last.streaming)) {
            if (last.pending || last.assistant === 'Thinking…' || !last.assistant?.trim()) {
              finishChatTurn(summary, { agentLive: false });
            } else if (last.streaming) {
              finishChatTurn(summary, { agentLive: false });
            } else if (!last.assistant.includes(summary.slice(0, 48))) {
              finishChatTurn(summary, { agentLive: false });
            }
          } else if (last.pending && summary) {
            finishChatTurn(summary, { agentLive: false });
          } else if (last.pending) {
            const partial = (last.assistant && last.assistant !== 'Thinking…') ? last.assistant : '';
            if (partial) finishChatTurn(partial, { agentLive: false });
          }
        }
        agentStreamActive = false;
        agentThinkingText = '';
        const m2 = loadChatMemory();
        if (m2.length) {
          m2[m2.length - 1].agentLive = false;
          m2[m2.length - 1].pending = false;
          m2[m2.length - 1].streaming = false;
          saveChatMemory(m2);
        }
        term('— run succeeded —');
        renderChatThread();
        onAgentRunSettled();
        pollRun(runId);
      });
      eventSource.addEventListener('run_error', e => {
        try {
          const d = JSON.parse(e.data);
          const errText = 'Run failed: ' + (d.message || 'unknown error');
          term('ERROR: ' + (d.message || ''));
          finishChatTurn(errText, { agentLive: false });
        } catch (_) {}
        agentStreamActive = false;
        agentThinkingText = '';
        term('— run failed —');
        renderChatThread();
        onAgentRunSettled();
        pollRun(runId);
      });
    }

    function showSite(url) {
      if (!url) return;
      const box = document.getElementById('successBox');
      const a = document.getElementById('siteLink');
      a.href = url;
      a.textContent = url;
      box.style.display = 'block';
    }

    const TERMINAL_RUN_STATES = new Set(['succeeded', 'failed', 'cancelled']);

    function stopRunPolling() {
      if (runPollTimer) {
        clearInterval(runPollTimer);
        runPollTimer = null;
      }
    }

    function startRunPolling(runId) {
      stopRunPolling();
      runPollTimer = setInterval(() => pollRun(runId), 3000);
    }

    async function pollRun(runId) {
      const res = await fetch('/runs/' + runId, { headers: { 'X-API-Key': apiKey() } });
      const run = await res.json();
      if (run.site_url) showSite(run.site_url);
      const mem = loadChatMemory();
      const lastTurn = mem.length ? mem[mem.length - 1] : null;
      if (
        run.agent_message &&
        !agentStreamActive &&
        !(lastTurn && lastTurn.streaming) &&
        !(lastTurn && lastTurn.pending)
      ) {
        patchLatestAssistant(run.agent_message);
      }
      if (run.state === 'awaiting_approval') {
        document.getElementById('approvalBar').style.display = 'block';
      }
      if (run.state === 'failed' && mem.length && mem[mem.length - 1].pending) {
        finishChatTurn(run.error_message || run.result_summary || 'Run failed.', { agentLive: false });
      }
      if (run.state === 'succeeded' && mem.length && mem[mem.length - 1].pending) {
        const doneText =
          (run.result_summary || run.agent_message || '').trim() || 'Done.';
        finishChatTurn(doneText, { agentLive: false });
      }
      if (run.state === 'cancelled' && mem.length && mem[mem.length - 1].pending) {
        finishChatTurn(run.result_summary || run.error_message || 'Run cancelled.', { agentLive: false });
      }
      if (TERMINAL_RUN_STATES.has(run.state)) {
        stopRunPolling();
        onAgentRunSettled();
      }
      return run;
    }

    document.getElementById('approveBtn').onclick = async () => {
      if (!currentRunId) return;
      document.getElementById('approvalBar').style.display = 'none';
      term('— approved — continuing deploy…');
      const res = await fetch('/runs/' + currentRunId + '/approve', { method: 'POST', headers: { 'X-API-Key': apiKey() } });
      const run = await res.json();
      term('— state: ' + run.state + ' —');
      startRunPolling(currentRunId);
    };

    async function stopAgentChat() {
      if (agentChatAbort) agentChatAbort.abort();
      agentChatAbort = null;
      if (currentRunId) {
        await fetch('/runs/' + encodeURIComponent(currentRunId) + '/cancel', {
          method: 'POST',
          headers: headers(),
        }).catch(() => {});
      }
      if (eventSource) {
        eventSource.close();
        eventSource = null;
      }
      agentStreamActive = false;
      agentThinkingText = '';
      stopRunPolling();
      finishChatTurn('Stopped.', { agentLive: false });
      agentChatInFlight = false;
      const btn = document.getElementById('chatSend');
      setComposerSendButton(btn, 'send');
      btn.disabled = false;
    }

    async function sendChat() {
      if (agentChatInFlight) {
        await stopAgentChat();
        return;
      }
      const input = document.getElementById('message');
      const userText = input.value.trim();
      if (!userText) return;
      input.value = '';
      appendChatTurn(userText);
      clearTerm();
      const started = Date.now();
      const chatBtn = document.getElementById('chatSend');
      agentChatInFlight = true;
      agentChatAbort = new AbortController();
      setComposerSendButton(chatBtn, 'stop');
      chatBtn.disabled = false;
      let res;
      try {
        res = await fetch('/chat', {
          method: 'POST',
          headers: headers(),
          signal: agentChatAbort.signal,
          body: JSON.stringify({
            message: userText,
            app: document.getElementById('liaraApp').value.trim() || null,
            target_env: 'staging',
            history: chatHistoryForApi(),
          }),
        });
      } catch (e) {
        agentChatInFlight = false;
        agentChatAbort = null;
        setComposerSendButton(chatBtn, 'send');
        if (e && e.name === 'AbortError') {
          finishChatTurn('Stopped.', { agentLive: false });
        } else {
          finishChatTurn('Something went wrong: ' + (e.message || e), { agentLive: false });
        }
        return;
      }
      const run = await res.json();
      if (!res.ok) {
        const err = typeof run.detail === 'string' ? run.detail : JSON.stringify(run.detail || run);
        finishChatTurn('Something went wrong: ' + err, { agentLive: false });
        term('Error: ' + err);
        agentChatInFlight = false;
        agentChatAbort = null;
        setComposerSendButton(chatBtn, 'send');
        return;
      }
      agentChatAbort = null;
      setComposerSendButton(chatBtn, 'stop');
      currentRunId = run.id;
      connectStream(run.id);
      if (run.agent_message && isStreamingSkill(run.skill_id)) {
        const mem = loadChatMemory();
        if (mem.length && mem[mem.length - 1].pending) {
          mem[mem.length - 1].assistant = run.agent_message + '\n\nDeploy in progress…';
          mem[mem.length - 1].agentLive = true;
          saveChatMemory(mem);
          renderChatThread();
        }
      } else if (run.agent_message && !isStreamingSkill(run.skill_id)) {
        finishChatTurn(run.agent_message, { durationMs: Date.now() - started, agentLive: true });
      }
      term('Run ' + run.id + ' — ' + (run.skill_id || '') + ' — ' + run.state);
      document.getElementById('runMeta').textContent = 'Run ' + run.id;
      if (run.state === 'awaiting_approval') {
        document.getElementById('approvalBar').style.display = 'block';
      }
      startRunPolling(run.id);
      pollRun(run.id);
    }

    function onAgentRunSettled() {
      if (!agentChatInFlight) return;
      agentChatInFlight = false;
      agentChatAbort = null;
      const chatBtn = document.getElementById('chatSend');
      setComposerSendButton(chatBtn, 'send');
      chatBtn.disabled = false;
    }

    document.getElementById('chatSend').onclick = () => {
      if (agentChatInFlight) {
        stopAgentChat();
        return;
      }
      sendChat();
    };
    document.getElementById('message').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendChat();
      }
    });
    document.getElementById('chatClear').onclick = () => {
      if (!confirm('Clear this chat thread?')) return;
      sessionStorage.removeItem(CHAT_STORAGE_KEY);
      chatPendingTurn = null;
      renderChatThread();
    };

    (function initTerminalResize() {
      const TERMINAL_HEIGHT_KEY = 'deployer_terminal_height_v2';
      const VSCODE_DEFAULT_TERMINAL_PX = 340;
      const panel = document.querySelector('.left-panel');
      const wrap = document.getElementById('terminalWrap');
      const handle = document.getElementById('terminalResizeHandle');
      if (!panel || !wrap || !handle) return;

      function topChromeHeight() {
        const toolbar = panel.querySelector('.left-toolbar');
        const banners = panel.querySelector('.left-banners');
        const cursorMin = 200;
        return (toolbar?.offsetHeight || 0) + (banners?.offsetHeight || 0) + cursorMin + 8;
      }

      function maxTerminalHeight() {
        const handleH = handle.offsetHeight + 8;
        return Math.max(120, panel.clientHeight - topChromeHeight() - handleH);
      }

      function applyTerminalHeight(px) {
        const h = Math.min(maxTerminalHeight(), Math.max(120, px));
        wrap.style.height = h + 'px';
        return h;
      }

      const saved = parseInt(localStorage.getItem(TERMINAL_HEIGHT_KEY) || '', 10);
      const defaultH = Math.min(VSCODE_DEFAULT_TERMINAL_PX, maxTerminalHeight());
      applyTerminalHeight(saved >= 120 ? saved : defaultH);

      window.addEventListener('resize', () => {
        const current = wrap.getBoundingClientRect().height;
        applyTerminalHeight(current);
      });

      function startDrag(clientY) {
        const startY = clientY;
        const startH = wrap.getBoundingClientRect().height;
        handle.classList.add('is-dragging');
        document.body.style.userSelect = 'none';
        document.body.style.cursor = 'ns-resize';

        function onMove(ev) {
          const y = ev.touches ? ev.touches[0].clientY : ev.clientY;
          // Terminal is bottom-anchored: drag the top edge up to grow height.
          applyTerminalHeight(startH + (startY - y));
        }

        function onUp() {
          handle.classList.remove('is-dragging');
          document.body.style.userSelect = '';
          document.body.style.cursor = '';
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
          document.removeEventListener('touchmove', onMove);
          document.removeEventListener('touchend', onUp);
          localStorage.setItem(TERMINAL_HEIGHT_KEY, String(Math.round(wrap.getBoundingClientRect().height)));
        }

        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
        document.addEventListener('touchmove', onMove, { passive: false });
        document.addEventListener('touchend', onUp);
      }

      handle.addEventListener('mousedown', e => {
        e.preventDefault();
        startDrag(e.clientY);
      });
      handle.addEventListener('touchstart', e => {
        if (e.touches.length === 1) {
          e.preventDefault();
          startDrag(e.touches[0].clientY);
        }
      }, { passive: false });
    })();
  </script>
